# ============================================================================
# Gradient-alignment experiment (§3.2)
# ============================================================================
# Standard triplet run with Seidel S2+S3 BCs, instrumented to log raw
# parent gradients (∇L, ∇M_1, ∇M_2) every CMA-MEGA generation.
# Hyperparameters match the §4.2 main triplet baseline:
#   - 19D theta (3 elements: curvatures, gaps, flange, n+V per element)
#   - 50mm focal length, polychromatic (F, d, C)
#   - N_seed = 2000, pop_size = 36, 200x200 archive grid
#   - Seidel S2 (coma) + S3 (astigmatism) descriptors
# Logging is read-only: no algorithmic changes.

problem:
  kind: lens
  lens_path: /home/hisham26/Desktop/RL/DeepLens/datasets/lenses/cooke_smaller_ap_1mm.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.486, 0.587, 0.656]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  parameterization: full_dof

  free_curvature_indices: [0, 1, 2, 3, 5, 6]
  derived_curvature_index: null
  focal_length_target_mm: 50.0
  efl_penalty_weight: 10.0

  free_gap_indices: [0, 1, 2, 3, 4, 5]
  variable_flange: true
  variable_materials: true
  free_material_indices: [0, 1, 2]

  theta_bounds:
    - [-0.08, 0.08]      # c0
    - [-0.08, 0.08]      # c1
    - [-0.08, 0.08]      # c2
    - [-0.08, 0.08]      # c3
    - [-0.08, 0.08]      # c5
    - [-0.08, 0.08]      # c6
    - [0.8, 3.2]         # g0
    - [0.5, 10.0]        # g1
    - [0.8, 3.2]         # g2
    - [0.5, 10.0]        # g3
    - [0.5, 10.0]        # g4
    - [0.8, 3.2]         # g5
    - [30.0, 65.0]       # flange
    - [1.45, 1.85]       # n_0
    - [25, 75]           # V_0
    - [1.45, 1.85]       # n_1
    - [25, 75]           # V_1
    - [1.45, 1.85]       # n_2
    - [25, 75]           # V_2

  stage: stage2
  num_rays: 256
  invalid_tol: 0.2
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: false
  descriptor_field_index: 1

descriptor:
  kind: seidel
  params:
    terms: ["S2", "S3"]

algorithm:
  population_size: 36
  initial_sigma: 0.5
  cma_eta: 0.15
  cma_seed: 42
  seed_count: 2000
  calibration_count: 2000
  iterations: 50000
  new_cell_bonus: 1.0e6
  log_every: 50
  restart_patience: 2

archive:
  bins: [200, 200]
  bounds: [[-0.001, 0.001], [-0.001, 0.001]]
  bound_calibration_pad: 0.05

io:
  results_dir: /home/hisham26/Desktop/RL/experiments/gradient_alignment/run
  run_name: gradient_alignment_triplet
  checkpoint_every: 200
  device: auto
  parallel_workers: 18
  log_gradients: true
