# Steelman replication: same as sa_ga_baseline_norefine_100k.yaml but
# with ga_diversity_min_distance raised from 0.05 to 0.20 to match
# QGSO's default `div_rate=0.20` (gygad.py:351).
#
# This tests whether SA+GA's diversity gap vs HL closes when its parent
# selection filter is at QGSO-default tightness.

seed: 42
population_size: 100
generations_max: 200

# --- SA inner loop ---
sa_iter_max: 50
sa_rand_range: 0.1
sa_plateau_window: 20
sa_plateau_min_delta: 0.0025

# --- GA selection ---
ga_selection_ratio: 0.06
ga_elite_ratio: 0.02
ga_diversity_min_distance: 0.20  # was 0.05; now matches QGSO div_rate=0.20

# --- ADAM ---
adam_iter_num: 30
adam_lr: 0.001
adam_beta1: 0.9
adam_beta2: 0.9
adam_cos_T: 10.0
adam_plateau_window: 10
adam_plateau_eps: 0.001

# --- Mutation ---
mutation_num_genes: 2

# --- Tracker ---
tracker_threshold: -10.0
max_tracked_elites: 2000
